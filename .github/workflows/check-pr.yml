name: PR Check

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: check-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-file-changes:
    name: Check File Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dart_required: ${{ steps.plan.outputs.dart_required }}
      format_required: ${{ steps.plan.outputs.format_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan quality checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/quality.py --base "$BASE_SHA" --head "$HEAD_SHA" --plan >> "$GITHUB_OUTPUT"

  tooling:
    name: Development tooling fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Test change detection and Stop protocol
        run: python3 -B -m unittest discover -s scripts/tests -v

  analyze-and-format:
    name: Analysis, Testing, and Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check-file-changes
    if: needs.check-file-changes.outputs.dart_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3.5.1
        with:
          install_args: flutter
          cache: true
      - name: Setup Flutter workspace
        uses: ./.github/actions/setup-flutter
      - name: Verify committed dependency resolution
        run: git diff --exit-code -- pubspec.lock
      - name: Check all workspaces and their consumers
        run: python3 -B scripts/quality.py --all --checks dart

  formatting:
    name: Document and configuration formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: check-file-changes
    if: needs.check-file-changes.outputs.format_required == 'true'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Setup dprint
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3.5.1
        with:
          install_args: dprint
          cache: true
      - name: Check configured formatting
        run: python3 -B scripts/quality.py --all --checks format
