name: "Setup Flutter Workspace"
description: "Cache dependencies and resolve the committed Flutter workspace lockfile"

runs:
  using: "composite"
  steps:
    # pub cache をキャッシュ
    - name: Cache pub dependencies
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    - name: Resolve the committed workspace lockfile
      shell: bash
      run: flutter pub get --enforce-lockfile
