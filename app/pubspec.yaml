name: app
description: "A minimal Flutter app with explicit architecture boundaries."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: 3.44.6

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  design_system:
    path: ../packages/design_system
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.3
  slang: ^4.11.1
  slang_flutter: ^4.11.0
  talker: ^5.0.2
  talker_flutter: ^5.0.2
  talker_riverpod_logger: ^5.0.2
dev_dependencies:
  analyzer: ^12.1.0
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  go_router_builder: ">=4.3.1 <4.4.0"
  riverpod_generator: ^4.0.4
  shared_preferences_platform_interface: ^2.4.1
  slang_build_runner: ^4.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
