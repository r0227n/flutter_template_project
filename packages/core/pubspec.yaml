name: core
description: Core utilities and services for the Flutter template project including logging and preferences management.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: 3.35.1

resolution: workspace

dependencies:
  firebase_crashlytics: ^5.0.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  slang: ^4.11.1
  slang_flutter: ^4.11.0
  talker: ^5.0.2
  talker_flutter: ^5.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/

dev_dependencies:
  build_runner: ^2.7.1
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^3.0.3
  slang_build_runner: ^4.11.0
  yumemi_lints: ^4.2.0
