name: workspace
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  melos: 8.10.1
  riverpod_lint: ^3.1.3
  very_good_analysis: ^10.1.0

workspace:
  - app
  - packages/design_system

melos:
  name: flutter_template_project

  scripts:
    gen:
      description: Generate annotated source in all workspace packages
      run: dart run melos exec --depends-on=build_runner -- "dart run build_runner build"

    gen:slang:
      description: Generate translations from Slang JSON
      run: dart run melos exec --depends-on=slang_build_runner -- "dart run slang"

    get:
      description: Resolve the Pub workspace
      run: flutter pub get

    analyze:
      description: Analyze all workspace packages
      run: dart run melos exec -- "dart analyze --fatal-infos"

    analyze:slang:
      description: Validate translation coverage
      run: dart run melos exec --depends-on=slang -- "dart run slang analyze --exit-if-changed"

    format:
      description: Format Dart source in all workspace packages
      run: dart run melos exec -- "dart format ."

    ci:format:
      description: Check Dart formatting without changing files
      run: dart run melos exec -- "dart format --output=none --set-exit-if-changed ."

    test:
      description: Run all workspace tests
      run: dart run melos exec --fail-fast --concurrency=1 --dir-exists=test -- "flutter test"

  environment:
    sdk: ">=3.12.0 <4.0.0"
    flutter: ">=3.44.6"
